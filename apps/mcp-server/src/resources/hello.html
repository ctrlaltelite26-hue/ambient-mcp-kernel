<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chaperone · Hello</title>
    <style>
      :root {
        color-scheme: light;
        --mist: #f3f6f4;
        --spruce: #1f4d45;
        --ink: #1a1f1c;
        --muted: #5c6660;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        background: radial-gradient(circle at 14% 12%, rgba(200, 222, 212, 0.55), transparent 58%),
          var(--mist);
        color: var(--ink);
      }
      main {
        width: min(420px, 92vw);
        padding: 1.5rem;
        border: 1px solid #e2eae5;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 24px -4px rgba(31, 77, 69, 0.05);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        font-weight: 500;
        color: var(--spruce);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      code {
        font-size: 0.85em;
        color: var(--spruce);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chaperone</h1>
      <p>
        Phase 0 hello MCP App resource.
        <code>ui://chaperone/hello.html</code>
      </p>
    </main>
  </body>
</html>
